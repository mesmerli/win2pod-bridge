[package]
name = "homepod-cast-gui"
version = "0.1.0"
edition = "2021"
description = "Modern AirFlash-style GUI and system tray for AirPlay 2 streaming"

[[bin]]
name = "win2pod"
path = "src/main.rs"

[dependencies]
airplay-core = { path = "../airplay-core" }
airplay-client = { path = "../airplay-client" }
airplay-discovery = { path = "../airplay-discovery" }
airplay-audio = { path = "../airplay-audio" }

# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

# System Tray & Menus
tray-icon = "0.24"

# Async & threading
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-channel = "2"
crossbeam-channel = "0.5"
anyhow = "1"
serde = { workspace = true }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Windows Audio Loopback & Win32 API
wasapi = "0.23"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
    "Services_Store",
] }
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }

[build-dependencies]
winres = "0.1"
