<!doctype html>
<html lang="en" data-ui-hidden>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Win2Pod Motion - Paint Pulse</title>
<style>
:root {
  --bg: #121316;
  --panel: rgba(24, 25, 29, 0.88);
  --card: rgba(32, 34, 40, 0.65);
  --ink: #f8fafc;
  --muted: #94a3b8;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.14);
  --soft: rgba(255, 255, 255, 0.05);
  --soft-hover: rgba(255, 255, 255, 0.09);
  --accent: #2563eb;
  --accent-hover: #3b82f6;
  --accent-glow: rgba(37, 99, 235, 0.35);
  --accent-cyan: #38bdf8;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#ui, #keys { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(320px, calc(100% - 32px)); max-height: calc(100dvh - 32px); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; padding: 16px; display: grid; gap: 12px;
  backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.05) inset; z-index: 50; }
#ui::-webkit-scrollbar, #keys::-webkit-scrollbar { display: none; }
#ui { left: calc(16px + env(safe-area-inset-left, 0px)); }
#keys { right: calc(16px + env(safe-area-inset-right, 0px)); }
@media (max-width: 600px) {
  #ui, #keys { left: 0; right: 0; bottom: 0; width: auto; max-height: 65%; border-width: 1px 0 0; border-radius: 18px 18px 0 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
  header p { display: none; }
}
header h1 { margin: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; color: #fff; display: flex; align-items: center; gap: 6px; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 11.5px; line-height: 1.4; }
.panel-close-btn { background: transparent; border: 1px solid transparent; color: var(--muted); width: 26px; height: 26px; min-height: unset; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.15s ease; }
.panel-close-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; border-color: var(--line); }

.grp { display: grid; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.lab { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 12px; }
.lab output { color: var(--accent-cyan); font-weight: 600; font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row .lab { flex: 1; }
button { font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px;
  cursor: pointer; min-height: 30px; transition: all 0.15s ease; }
button:hover { background: var(--soft-hover); border-color: var(--line-strong); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: #fff; min-width: 80px; font-weight: 500; border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 2px 8px var(--accent-glow); }
button.primary:hover { background: var(--accent-hover); }
button:disabled { opacity: .4; cursor: default; }
.seg { display: inline-flex; background: rgba(18, 19, 22, 0.7); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button { background: transparent; border: none; min-height: 25px; padding: 3px 9px; border-radius: 5px; font-size: 11.5px; color: var(--muted); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 500; box-shadow: 0 1px 4px var(--accent-glow); }
input[type=range] { width: 100%; margin: 4px 0 2px; accent-color: var(--accent-cyan); height: 5px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
.meta { margin: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.track { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4; }

.meters { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; color: var(--muted); font-size: 11.5px;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #38bdf8, #818cf8); border-radius: 3px; }
.bar.beat i { background: linear-gradient(90deg, #f59e0b, #ef4444); }
.spec { display: flex; align-items: flex-end; gap: 2px; height: 26px; }
.spec i { flex: 1; height: 100%; border-radius: 1px; transform-origin: bottom; transform: scaleY(0.04); }

.bottom-hint, #bShow { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 500;
  color: var(--muted); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s ease; user-select: none; -webkit-user-select: none; }
.bottom-hint { right: calc(16px + env(safe-area-inset-right, 0px)); }
#bShow { left: calc(16px + env(safe-area-inset-left, 0px)); }
.bottom-hint:hover, #bShow:hover { background: var(--card); border-color: var(--accent); color: #fff; box-shadow: 0 0 12px var(--accent-glow); }
.bottom-hint kbd, #bShow kbd { font-size: 11px; padding: 1px 5px; }
[hidden] { display: none !important; }
html[data-ui-hidden] #liteNote { display: none !important; }

.keys-sec { font-size: 11px; font-weight: 600; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
.keys-sec::after { content: ''; flex: 1; height: 1px; background: var(--line); }
#keys table { border-collapse: collapse; width: 100%; margin: 0; }
#keys td { padding: 4.5px 0; vertical-align: middle; border-top: 1px solid var(--line); font-size: 12px; color: #cbd5e1; }
#keys tr:first-child td { border-top: none; }
#keys td:first-child { white-space: nowrap; padding-right: 14px; }
kbd { font: 11px var(--font); border: 1px solid var(--line-strong); border-radius: 4px; padding: 2px 6px; background: rgba(255, 255, 255, 0.08); color: var(--accent-cyan); font-weight: 600; }
#toast { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--panel);
  border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 16px; pointer-events: none; backdrop-filter: blur(24px); z-index: 30;
  color: #fff; font-size: 12.5px; font-weight: 500; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
.top-actions { position: fixed; top: 16px; right: 16px; z-index: 1000; display: flex; align-items: center; gap: 8px; }
.top-btn { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 50%; width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted);
  font-size: 15px; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); transition: all 0.15s ease;
  user-select: none; -webkit-user-select: none; padding: 0; }
.top-btn:hover { background: var(--card); border-color: var(--accent); color: #fff; box-shadow: 0 0 14px var(--accent-glow); }
.top-btn.active { background: var(--accent); color: #fff; border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 0 16px var(--accent-glow); }
.top-btn.danger:hover { background: rgba(239, 68, 68, 0.85); color: #fff; border-color: transparent; box-shadow: 0 0 16px rgba(239, 68, 68, 0.45); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="topActions" class="top-actions">
  <button type="button" id="bMainWin" class="top-btn" data-i18n-title="top_main" title="回到 Win2Pod 主視窗 (W)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"></path>
    </svg>
  </button>
  <button type="button" id="bTopFull" class="top-btn" data-i18n-title="top_full" title="全螢幕切換 (F)">
    <svg id="topFullSvg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
    </svg>
  </button>
  <button type="button" id="bPin" class="top-btn" data-i18n-title="top_pin" title="釘選在最上層">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="17" x2="12" y2="22"></line>
      <path d="M5 17h14v-2l-2-2V5a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v8l-2 2v2z"></path>
    </svg>
  </button>
</div>
<div id="status" data-i18n="loading">油彩調色中…</div>
<div id="toast" hidden role="status"></div>
<p id="liteNote" hidden></p>
<button type="button" id="bShow" aria-controls="ui" data-i18n="btn_show_panel" data-i18n-title="btn_show_panel" title="顯示面板 (H)">顯示面板 (H)</button>
<button type="button" id="bKeysHint" class="bottom-hint" data-i18n-title="hint_keys_title" title="點擊或按 ? 顯示快捷鍵說明">
  <span data-i18n-html="hint_keys">按 <kbd>?</kbd> 快捷鍵說明</span>
</button>
<div id="keys" hidden role="dialog" data-i18n-aria="keys_title" aria-label="鍵盤快捷鍵說明">
  <header>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h1 data-i18n="keys_title">鍵盤快捷鍵說明</h1>
      <button type="button" id="keysClose" class="panel-close-btn" data-i18n-aria="keys_close" aria-label="關閉快捷鍵說明">✕</button>
    </div>
  </header>
  <div class="grp">
    <div class="keys-sec" data-i18n="keys_sec_system">系統操作</div>
    <table>
      <tr><td><kbd>W</kbd></td><td data-i18n="key_w">叫出 Win2Pod 主控制面板</td></tr>
      <tr><td><kbd>F</kbd></td><td data-i18n="key_f">切換全螢幕 / 視窗化</td></tr>
      <tr><td><kbd>H</kbd></td><td data-i18n="key_h">隱藏 / 顯示控制面板</td></tr>
      <tr><td><kbd>?</kbd></td><td data-i18n="key_question">顯示 / 關閉此說明</td></tr>
      <tr><td><kbd>Esc</kbd></td><td data-i18n="key_esc">關閉視覺化視窗 (全螢幕時先還原)</td></tr>
    </table>
  </div>
  <div class="grp">
    <div class="keys-sec" data-i18n="keys_sec_motion">動畫與特效參數</div>
    <table>
      <tr><td><kbd>R</kbd></td><td data-i18n="key_r">自動旋轉 開 / 關</td></tr>
      <tr><td><kbd>P</kbd></td><td data-i18n="key_p">切換油畫筆觸 / 原色方塊</td></tr>
      <tr><td><kbd>[</kbd> <kbd>]</kbd></td><td data-i18n="key_bracket">調低 / 調高律動靈敏度</td></tr>
    </table>
  </div>
</div>

<div id="ui" hidden>
  <header>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h1>Paint Pulse</h1>
      <button type="button" id="bHide" class="panel-close-btn" data-i18n-title="btn_hide_panel" title="隱藏控制面板 (H)">✕</button>
    </div>
    <p data-i18n="panel_desc">油畫音樂脈衝：即時聆聽 Win2Pod 系統音訊串流，色彩從深紅低音流轉至紫羅蘭高音，隨旋律與節奏律動擴散與聚合。</p>
  </header>

  <div class="meters" aria-label="音訊強度指標">
    <span data-i18n="meter_spec">頻譜</span><div class="spec" id="spec" data-i18n-title="meter_spec_tip" title="40 Hz (低音) 至 14 kHz (高音)；色彩對應球體頻段"></div>
    <span data-i18n="meter_beat">重拍</span><div class="bar beat"><i id="mBeat"></i></div>
    <span data-i18n="meter_spread">展開度</span><div class="bar"><i id="mSpread"></i></div>
  </div>

  <div class="grp">
    <div class="lab"><span data-i18n="label_sensitivity">律動靈敏度</span><output id="sensOut">150%</output></div>
    <input type="range" id="sens" min="40" max="250" step="5" value="150" data-i18n-aria="label_sensitivity" aria-label="律動靈敏度">
    <div class="lab"><span data-i18n="label_stroke">筆觸大小</span><output id="strokeOut">23 px</output></div>
    <input type="range" id="stroke" min="3" max="30" step="1" value="23" data-i18n-aria="label_stroke" aria-label="筆觸大小">
    <div class="row"><span class="lab" data-i18n="label_style">視覺風格</span>
      <div class="seg" role="group" id="lookSeg">
        <button type="button" data-v="1" data-i18n="opt_painted" aria-pressed="true">油畫筆觸</button>
        <button type="button" data-v="0" data-i18n="opt_cubes" aria-pressed="false">幾何方塊</button>
      </div>
    </div>
    <div class="row"><span class="lab" data-i18n="label_flow">流動路徑</span>
      <div class="seg" role="group" id="flowSeg">
        <button type="button" data-v="1" data-i18n="opt_swirl" aria-pressed="true">螺旋飛旋</button>
        <button type="button" data-v="0" data-i18n="opt_radial" aria-pressed="false">直線放射</button>
      </div>
    </div>
    <div class="row"><span class="lab" data-i18n="label_rotate">自動旋轉</span>
      <div class="seg" role="group" id="rotateSeg">
        <button type="button" data-v="1" data-i18n="opt_on" aria-pressed="true">開啟</button>
        <button type="button" data-v="0" data-i18n="opt_off" aria-pressed="false">關閉</button>
      </div>
    </div>
  </div>
</div>

<script>
window.__pendingLang = null;
window.setLanguage = function(lang) {
  window.__pendingLang = lang;
};
window.addEventListener('error', function(e) {
  var s = document.getElementById('status');
  if (s) {
    s.hidden = false;
    var msg = e.message || (e.target && e.target.src ? 'Failed to load: ' + e.target.src : 'Script error');
    s.textContent = 'Err: ' + msg;
  }
  console.error('Visualizer error:', e);
}, true);
window.addEventListener('unhandledrejection', function(e) {
  var s = document.getElementById('status');
  if (s) {
    s.hidden = false;
    s.textContent = 'Promise: ' + (e.reason && (e.reason.message || e.reason));
  }
  console.error('Visualizer unhandled rejection:', e);
});
</script>

const freq = new Uint8Array(1024);

function handleHostAudio(data) {
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch { return; }
  }
  if (!data) return;
  if (data.type === 'set_language' && data.lang) {
    applyLanguage(data.lang);
    return;
  }
  if (data.type === 'spectrum' && data.data) {
    const arr = data.data;
    const len = arr.length;
    if (len > 0) {
      // Linear interpolation mapping from arr (e.g. 256 bins) to freq (1024 bins)
      const ratio = (len - 1) / 1023;
      let sumEnergy = 0;
      for (let i = 0; i < 1024; i++) {
        const pos = i * ratio;
        const idx = Math.floor(pos);
        const frac = pos - idx;
        const v0 = arr[idx] || 0;
        const v1 = arr[Math.min(len - 1, idx + 1)] || 0;
        const val = Math.round(v0 * (1 - frac) + v1 * frac);
        freq[i] = val;
        sumEnergy += val;
      }

      liveFromHost = true;
      lastHostTime = performance.now();
      const avgLevel = sumEnergy / (1024 * 255);
      hostHasAudioEnergy = avgLevel > 0.005;
    }
  }

  isFullscreen = !!fs;
  const topFull = $('bTopFull');
  if (topFull) {
    topFull.title = isFullscreen ? t('top_windowed') : t('top_full');
    topFull.innerHTML = isFullscreen
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6m0 0v6m0-6l-7 7m17-11h-6m0 0V4m0 6l7-7"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>';
  }
  if (isFullscreen) {
    toast(t('toast_fullscreen_sleep_prevented'), 2400);
  } else if (wasFullscreen) {
    toast(t('toast_windowed_sleep_restored'), 2400);
  }
};

window.handleVisPinChanged = function(pinned, showToast = true) {
  isVisPinned = !!pinned;
  const btn = $('bPin');
  if (btn) {
    btn.setAttribute('aria-pressed', String(isVisPinned));
    btn.title = isVisPinned ? t('top_unpin') : t('top_pin');
    btn.classList.toggle('active', isVisPinned);
  }
  if (showToast) {
    toast(isVisPinned ? t('toast_pinned') : t('toast_unpinned'));
  }
};

if (QS.get('pinned') === '1' || QS.get('pinned') === 'true') {
  window.handleVisPinChanged(true, false);
}

const bPinEl = $('bPin');
if (bPinEl) {
  bPinEl.onclick = e => {
    e.stopPropagation();
    sendIpc('toggle_pin');
  };
}

const bTopFullEl = $('bTopFull');
if (bTopFullEl) {
  bTopFullEl.onclick = e => {
    e.stopPropagation();
    toggleFullscreen();
  };
}

function requestShowMain() {
  sendIpc('show_main');
  window.focus();
  toast(t('toast_main'));
}

const bMainWinEl = $('bMainWin');
if (bMainWinEl) {
  bMainWinEl.onclick = e => {
    e.stopPropagation();
    requestShowMain();
  };
}

/* ---------- listening: bands, beats, section ---------- */
const binOf = hz => Math.max(1, Math.min(1023, Math.round(hz / 22050 * 1024)));
const band = (lo, hi) => { let s = 0; const a = binOf(lo), b = Math.max(a + 1, binOf(hi)); for (let i = a; i < b; i++) s += freq[i]; return s / (b - a) / 255; };
const prevFreq = new Uint8Array(1024);
// Per band: level, a slow peak (to compare bands that differ in loudness), onset strength (spectral flux) with an
// adaptive threshold, and the band's own debris clock t. A later per-band effect can hang off this state too.
const BS = BANDS.map(() => ({ level: 0, env: 0, peak: 0.15, flux: 0, fluxAvg: 0, fluxDev: 0.01, last: -1, kick: 0, onsets: 0, t: 0, tShow: 0, punch: 0, show: 0 }));
const A = { low: 0, mid: 0, high: 0, beat: 0, section: 0, beats: 0, energy: 0 };
const kickBins = [30, 120];   // the beat (Beat meter, whole-ball pulse) comes from the kick range
let kickS = { flux: 0, fluxAvg: 0, fluxDev: 0.01, last: -1 };
function onsetFlux(lo, hi) { let f = 0; const a = binOf(lo), b = Math.max(a + 1, binOf(hi)); for (let i = a; i < b; i++) { const d = freq[i] - prevFreq[i]; if (d > 0) f += d; } return f / ((b - a) * 255); }
function listen(now, dt) {
  const live = liveFromHost && (performance.now() - lastHostTime < 1000);
  if (live) {
    let sumMag = 0;
    for (let i = 0; i < 1024; i++) sumMag += freq[i];
    const energy = sumMag / (1024 * 255);
    const boostEnergy = Math.min(1.0, energy * 3.5);
    A.section += (boostEnergy - A.section) * Math.min(1, dt * 7);
  } else {
    A.section *= 1 - Math.min(1, dt * 3);
  }
  const k = Math.min(1, dt * 2.5);   // ~0.4 s memory for the onset thresholds
  const onset = (s, flux) => {        // adaptive threshold: an onset is a jump well above the recent average
    const thr = s.fluxAvg + Math.max(0.012, 2 * s.fluxDev); let hit = 0;
    if (live && flux > thr && now - s.last > 0.16) { s.last = now; hit = Math.min(1, 0.55 + 0.45 * (flux - thr) / (thr + 0.02)); }
    s.fluxAvg += (flux - s.fluxAvg) * k; s.fluxDev += (Math.abs(flux - s.fluxAvg) - s.fluxDev) * k; return hit;
  };
  let sum = 0;
  BANDS.forEach((B, n) => {
    const s = BS[n];
    s.level = live ? band(B.hz[0], B.hz[1]) : s.level * 0.85;
    s.env += (s.level - s.env) * Math.min(1, dt * (s.level > s.env ? 40 : 5));   // fast attack, slow release
    s.peak = Math.max(s.env, s.peak - dt * 0.02, 0.12);   // a slow peak: a soft passage stays soft
    const hit = onset(s, live ? onsetFlux(B.hz[0], B.hz[1]) : 0);
    if (hit) { s.kick = Math.max(s.kick, hit); s.onsets++; }
    s.show = (s.env / s.peak) * smooth(0.03, 0.12, s.env);   // 0..1, comparable across bands
    sum += s.show;
  });
  const kh = onset(kickS, live ? onsetFlux(kickBins[0], kickBins[1]) : 0);
  if (kh) { A.beats++; A.beat = Math.max(A.beat, kh); }
  if (live) prevFreq.set(freq);
  const third = a => BS.slice(a * NB / 3, (a + 1) * NB / 3).reduce((x, s) => x + s.env, 0) / (NB / 3);
  A.low = third(0); A.mid = third(1); A.high = third(2);
  A.energy += (sum / NB - A.energy) * Math.min(1, dt * 6);
  A.beat = Math.max(0, A.beat - dt * 3.5);
}

/* ---------- driving the band clocks ---------- */
let sens = 1.5, hold = null;   // hold: fixed debris times (a number or one per band), for tests and screenshots
const tRaw = new Float32Array(NB);
function drive(dt) {
  // each band: loud passages and its own loudness open it, its onsets kick it outward at once, quiet parts pull it back
  BANDS.forEach((B, n) => {
    const s = BS[n];
    // squared level: a band stands out only when it is near its own peak; quiet sections damp everything
    const energy = (A.section * 0.15 + 0.55 * s.show * s.show) * (0.4 + 0.6 * A.section);
    const base = T_MAX * 0.6 * smooth(0.15, 0.9, energy * sens);
    if (s.kick > 0) {
      const loud = 0.12 + 0.88 * smooth(0.1, 0.5, energy * sens);   // onsets in quiet parts only nudge the band
      s.t += T_MAX * (0.1 + 0.15 * s.kick) * B.kick * Math.min(1.5, sens) * loud;
      s.punch = Math.min(0.45, s.punch + (0.12 + 0.16 * s.kick) * B.kick * loud); s.kick = 0;
    }
    const target = Math.min(T_MAX, base + T_MAX * s.punch);
    const rate = target > s.t ? 6 : 2.8;   // scatter fast, gather nearly as fast
    s.t += Math.max(-rate * dt, Math.min(rate * dt, (target - s.t) * Math.min(1, dt * 9)));
    s.t = Math.min(T_MAX, Math.max(0, s.t));
    s.punch = Math.max(0, s.punch - dt * 2.2);
    tRaw[n] = s.t;
  });
  // neighbours pull on each other a little, so the spectrum opens as a wave, not as separate blocks
  BS.forEach((s, n) => { s.tShow = 0.25 * tRaw[Math.max(0, n - 1)] + 0.5 * tRaw[n] + 0.25 * tRaw[Math.min(NB - 1, n + 1)]; });
  if (hold !== null) BS.forEach((s, n) => { s.tShow = Array.isArray(hold) ? hold[n] : hold; });
}

/* ---------- UI ---------- */
function toast(msg, ms = 1800) { const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(el._h); el._h = setTimeout(() => { el.hidden = true; }, ms); }
$('sens').oninput = e => { sens = e.target.value / 100; $('sensOut').textContent = e.target.value + '%'; };
let strokeTimer = 0;
$('stroke').value = STROKE0; $('strokeOut').textContent = STROKE0 + ' px';
$('stroke').oninput = e => { const v = +e.target.value; painter.strokeSize = v; $('strokeOut').textContent = v + ' px';
  strokeK = v / 7; if (strokes) { strokes.material.uniforms.uStrokeScale.value = 0.85 * strokeK; strokes.material.uniforms.uKeep.value = keepFor(v); }
  clearTimeout(strokeTimer);   // maxWidth is fixed per stroke mesh: rebuild it once the slider settles
  strokeTimer = setTimeout(() => { if (painted && strokes) { setPainted(false); setPainted(true); } }, 150); };
document.querySelectorAll('#lookSeg button').forEach(b => b.onclick = () => setPainted(b.dataset.v === '1'));
function setPanel(show, notify = true) {
  $('ui').hidden = !show;
  $('bShow').hidden = show;
  document.documentElement.toggleAttribute('data-ui-hidden', !show);
  if (notify) {
    if (!show) {
      toast(t('toast_hide_panel'));
    } else {
      toast(t('toast_show_panel'));
    }
  }
}
$('bHide').onclick = () => setPanel(false);
$('bShow').onclick = () => setPanel(true);
document.querySelectorAll('#flowSeg button').forEach(b => b.onclick = () => setFlow(b.dataset.v === '1'));
function setRotate(on, notify = false) {
  controls.autoRotate = !!on;
  document.querySelectorAll('#rotateSeg button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.v === '1') === controls.autoRotate)));
  if (notify) toast(controls.autoRotate ? t('toast_rotate_on') : t('toast_rotate_off'));
}
document.querySelectorAll('#rotateSeg button').forEach(b => b.onclick = () => setRotate(b.dataset.v === '1', true));
const showKeys = on => {
  $('keys').hidden = !on;
  const hint = $('bKeysHint');
  if (hint) hint.hidden = on;
};
const bKeysHintEl = $('bKeysHint');
if (bKeysHintEl) bKeysHintEl.onclick = () => showKeys($('keys').hidden);
const keysCloseEl = $('keysClose');
if (keysCloseEl) keysCloseEl.onclick = () => showKeys(false);

window.addEventListener('pointerdown', () => window.focus());

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches?.('input[type=range]') && e.code.startsWith('Arrow')) return;
  switch (e.code) {
    case 'KeyP': setPainted(!painted); toast(painted ? t('toast_style_painted') : t('toast_style_cubes')); break;
    case 'KeyW':
      e.preventDefault();
      requestShowMain();
      break;
    case 'KeyR': setRotate(!controls.autoRotate, true); break;
    case 'BracketLeft': case 'BracketRight': { const el = $('sens'); el.value = +el.value + (e.code === 'BracketRight' ? 10 : -10);
      el.dispatchEvent(new Event('input')); toast(`${t('toast_sensitivity')} ${el.value}%`); break; }
    case 'KeyF': toggleFullscreen(); break;
    case 'KeyH': setPanel($('ui').hidden); break;
    case 'Escape':
      if (isFullscreen) {
        toggleFullscreen();
      } else {
        closeVisualizer();
      }
      break;
    default: if (e.key === '?') showKeys($('keys').hidden);
  }
});

let isInitialResize = true;
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  if (isInitialResize) {
    camera.position.setLength(11.5 / Math.min(1, camera.aspect * 1.25));   // initial fit
    isInitialResize = false;
  }
  camera.updateProjectionMatrix();
  const s = renderer.getDrawingBufferSize(new THREE.Vector2()); painter.setSize(s.x, s.y);
}
addEventListener('resize', resize); resize();
$('status').hidden = true;
const urlLang = new URLSearchParams(location.search).get('lang');
applyLanguage(urlLang || navigator.language);
setPanel(false, false);
setRotate(controls.autoRotate, false);

/* ---------- loop ---------- */
const bars = ['mBeat', 'mSpread'].map($);
const specBars = BANDS.map(B => { const i = document.createElement('i'); i.style.background = B.css; $('spec').append(i); return i; });
const fps = { n: 0, t0: performance.now(), value: 0 };
// Adaptive quality: when frames keep running long (over ~18 ms), paint at a lower resolution; after a calm spell,
// try one step back up. Each step that has to come back down doubles the wait before the next try.
const AQ = { steps: [painter.resolutionScale, 0.55, 0.45], i: 0, avg: 16.7, slow: 0, calm: 0, wait: 3, upAt: -1e9 };
function adapt(ms, now) {
  if (!painted || ms > 250) return;   // background tab or a stall: not a frame-time signal
  AQ.avg += (ms - AQ.avg) * 0.1;   // smoothed: single frames jitter a few ms around the display interval
  if (AQ.avg > 18) { AQ.slow = Math.min(12, AQ.slow + 1); AQ.calm = 0; } else { AQ.slow = Math.max(0, AQ.slow - 0.5); AQ.calm += ms / 1000; }
  if (AQ.slow >= 12 && AQ.i < AQ.steps.length - 1) {
    if (now - AQ.upAt < 2) AQ.wait = Math.min(60, AQ.wait * 2);   // the last step up did not hold
    painter.resolutionScale = AQ.steps[++AQ.i]; AQ.slow = 0; AQ.calm = 0;
  } else if (AQ.i > 0 && AQ.calm > AQ.wait) { painter.resolutionScale = AQ.steps[--AQ.i]; AQ.calm = 0; AQ.upAt = now; }
}
let prev = performance.now(), prevWall = prev;
renderer.setAnimationLoop(nowMs => {
  const rawMs = nowMs - prev, dt = Math.min(0.05, rawMs / 1000); prev = nowMs; const now = nowMs / 1000;
  const wall = performance.now(); adapt(wall - prevWall, now); prevWall = wall;   // wall clock: some browsers pace rAF stamps
  listen(now, dt);
  drive(dt);
  boom.setTime(0); boom.setBurstOffsets(BS.map(s => -s.tShow));   // band n shows its own time
  const live = hold === null ? 1 : 0;
  BS.forEach((s, n) => { flow.uniforms.uSpec.value[n] = live * s.show * (0.5 + 0.5 * A.section); });
  flow.uniforms.uPulse.value = live * A.beat;
  boom.setSizeScale(1 + 0.4 * A.high);
  flow.uniforms.uFlowT.value += dt * (0.5 + 1.2 * A.energy + 1.6 * A.beat);   // the field drifts, faster when loud, surging on beats
  if (strokes) { strokes.material.uniforms.uBright.value = 1 + 0.45 * A.beat;
    strokes.material.uniforms.uLookAhead.value = -(0.03 + 0.05 * A.energy + 0.03 * A.beat); }   // longer strokes when loud
  controls.autoRotateSpeed = 0.5 + 2.5 * A.beat;
  controls.update();
  if (painted) painter.render(renderer); else renderer.render(scene, camera);
  BS.forEach((s, n) => { specBars[n].style.transform = `scaleY(${(0.04 + 0.96 * clamp01(s.show)).toFixed(3)})`; });
  [A.beat, Math.max(...BS.map(s => s.tShow)) / T_MAX].forEach((v, i) => { bars[i].style.width = (clamp01(v) * 100).toFixed(1) + '%'; });
  fps.n++; if (nowMs - fps.t0 > 1000) { fps.value = fps.n * 1000 / (nowMs - fps.t0); fps.n = 0; fps.t0 = nowMs; }
});
window.__pp = { boom, painter, A, fps, T_MAX, LITE, setPainted, controls,
  BS, BANDS, get t() { return Math.max(...BS.map(s => s.tShow)); }, get ts() { return BS.map(s => s.tShow); }, NB, hold(v) { hold = v; }, flow, setFlow, AQ };
</script>
